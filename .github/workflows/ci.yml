name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    name: analyze · format · test · traceability
    # macOS, not Linux: the golden baselines are rendered on macOS and icon
    # glyphs rasterize slightly differently across OSes. Free for public
    # repos, and it matches the development machine.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the package is developed and published
          # with — CI must validate what ships, not whatever is newest.
          # Bump deliberately (and re-run the full gate) when upgrading.
          flutter-version: '3.32.4'
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Format (fails on drift)
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/test

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Spec-ID traceability (QA spec ↔ test suite)
        run: bash tool/check_spec_ids.sh

      - name: Example dependencies
        run: flutter pub get
        working-directory: example

      - name: Example analyze
        run: flutter analyze
        working-directory: example

      - name: Example tests
        run: flutter test
        working-directory: example

      - name: Publish dry-run
        run: dart pub publish --dry-run
