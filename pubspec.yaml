name: page_curl_flip
description: >-
  A realistic cylindrical page-curl animation for Flutter. Ships a multi-page
  FlipBook widget with table of contents, a CurlOverlay you can drive with
  any animation, and a PageCurlRoute page transition. Zero dependencies,
  RTL-aware, every icon and label customizable.
version: 0.1.0
repository: https://github.com/vanisupriyam/page_curl_flip

environment:
  sdk: ^3.6.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
