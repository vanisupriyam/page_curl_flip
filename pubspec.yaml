name: page_curl_flip
description: >-
  A realistic cylindrical page-curl animation for Flutter. Ships a multi-page
  FlipBook widget with table of contents and built-in flip sound, a CurlOverlay
  you can drive with any animation, and a PageCurlRoute page transition.
  RTL-aware.
version: 0.1.0
repository: https://github.com/vanisupriyam/page_curl_flip

environment:
  sdk: ^3.6.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  # Sole dependency — plays the built-in page-flip sound. Disable the sound
  # entirely with FlipBook(enableSound: false).
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/page_flip.mp3
